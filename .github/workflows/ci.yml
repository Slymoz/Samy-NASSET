name: C++ CI (Build & Lint)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backtesting_engine

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          clang-format \
          clang-tidy \
          python3 \
          python3-pip

    - name: Make scripts executable
      run: chmod +x lint.sh build.sh

    - name: Configure CMake & Export Commands
      run: cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Run Linter (Clang-Format / Clang-Tidy)
      run: ./lint.sh

    - name: Compile Project
      run: cmake --build build -j$(nproc)
