name: Nexus AI CI (Tests & Smoke Test)

on:
  push:
    branches: [ main, master ]
    paths:
      - "nexus-ai/**"
      - ".github/workflows/nexus-ai-ci.yml"
  pull_request:
    branches: [ main, master ]
    paths:
      - "nexus-ai/**"
      - ".github/workflows/nexus-ai-ci.yml"

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: nexus-ai

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: nexus-ai/requirements*.txt

    # Same layout as the README quick start: a venv in nexus-ai/.venv
    - name: Create virtual environment and install dependencies
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install -r requirements-dev.txt

    - name: Lint (ruff)
      run: |
        source .venv/bin/activate
        ruff check .

    - name: Unit tests (pytest)
      run: |
        source .venv/bin/activate
        pytest -v

    - name: Smoke test (start.sh boots API + UI + MCP)
      run: ./scripts/smoke_test.sh

    - name: Show startup logs on failure
      if: failure()
      run: cat start.log || true
