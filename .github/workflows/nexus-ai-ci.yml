name: Nexus AI CI/CD

on:
  push:
    branches: [main, master]
    tags: ["nexus-ai-v*"] # e.g. nexus-ai-v1.1.0 publishes the image as 1.1.0
    paths:
      - "nexus-ai/**"
      - ".github/workflows/nexus-ai-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "nexus-ai/**"
      - ".github/workflows/nexus-ai-ci.yml"
  workflow_dispatch:

concurrency:
  group: nexus-ai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

defaults:
  run:
    working-directory: nexus-ai

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.6"

      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Formatting (ruff format)
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: nexus-ai/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Unit, API, MCP (real client, in memory) and Streamlit UI tests.
      # Ollama is faked, so no model is needed. Fails under 85% coverage.
      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: nexus-ai-coverage
          path: nexus-ai/coverage.xml

  smoke:
    name: Smoke test (full stack)
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nexus-ai/requirements*.txt

      # Same layout as the README quick start: a venv in nexus-ai/.venv
      - name: Create virtual environment and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Smoke test (start.sh boots API + UI + MCP)
        run: ./scripts/smoke_test.sh

      - name: Show startup logs on failure
        if: failure()
        run: cat start.log || true

  docker:
    name: Docker image
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # publish to GitHub Container Registry
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/nexus-ai
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=nexus-ai-v(.*),group=1
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: nexus-ai
          load: true
          tags: nexus-ai:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name nexus -p 127.0.0.1:8000:8000 -p 127.0.0.1:8501:8501 nexus-ai:ci
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8501/_stcore/health
          curl -sf http://127.0.0.1:8000/api/status | python3 -c \
            "import json, sys; s = json.load(sys.stdin); assert s['api'] and s['mcp'], s"
          echo "Container OK"

      - name: Container logs on failure
        if: failure()
        run: docker logs nexus || true

      # Continuous delivery: only for pushes to the default branch and
      # release tags, never for pull requests.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: nexus-ai
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
